<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tarefas | Donee</title>

    <!-- Fonte -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->

    <!-- CSS -->

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/components.css">

    <link rel="stylesheet" href="../css/dashboard.css">

    <link rel="stylesheet" href="../css/tasks.css">

</head>


<body>


    <div class="tasks-page">


        <!-- ========================= -->
        <!-- SIDEBAR -->
        <!-- ========================= -->

        <aside class="sidebar">


            <!-- LOGO -->

            <div class="sidebar-logo">

                <a href="dashboard.html">

                    <img
                        src="../assets/images/logo-Donee.png"
                        alt="Logo Donee"
                    >

                </a>

            </div>


            <!-- MENU -->

            <nav class="sidebar-menu">

                <a
                    href="dashboard.html"
                    class="menu-item"
                >

                    <i data-lucide="layout-dashboard"></i>

                    <span>Dashboard</span>

                </a>


                <a
                    href="tasks.html"
                    class="menu-item active"
                >

                    <i data-lucide="list-todo"></i>

                    <span>Tarefas</span>

                </a>


                <a
                    href="profile.html"
                    class="menu-item"
                >

                    <i data-lucide="user"></i>

                    <span>Perfil</span>

                </a>


                <a
                    href="settings.html"
                    class="menu-item"
                >

                    <i data-lucide="settings"></i>

                    <span>Configurações</span>

                </a>

            </nav>


            <!-- PERFIL -->

            <div class="sidebar-profile">

                <div class="profile-avatar">

                    <i data-lucide="user"></i>

                </div>


                <div class="profile-info">

                    <strong>Matheus</strong>

                    <span>Meu perfil</span>

                </div>

            </div>


        </aside>



        <!-- ========================= -->
        <!-- CONTEÚDO -->
        <!-- ========================= -->

        <main class="tasks-content">


            <!-- HEADER -->

            <header class="tasks-page-header">


                <div>

                    <h1>Minhas Tarefas</h1>

                    <p>
                        Gerencie suas tarefas e mantenha sua rotina organizada.
                    </p>

                </div>


                <button class="btn-primary">

                    <i data-lucide="plus"></i>

                    Nova Tarefa

                </button>


            </header>



            <!-- ========================= -->
            <!-- FILTROS -->
            <!-- ========================= -->

            <section class="task-filters">


                <button class="filter-button active">

                    Todas

                </button>


                <button class="filter-button">

                    Pendentes

                </button>


                <button class="filter-button">

                    Concluídas

                </button>


            </section>



            <!-- ========================= -->
            <!-- LISTA -->
            <!-- ========================= -->

            <section class="all-tasks">


                <div class="all-tasks-header">

                    <h2>Todas as tarefas</h2>

                    <span>3 tarefas</span>

                </div>


                <div class="all-tasks-list">


                    <!-- TAREFA 1 -->

                    <div class="task-card">

                        <div class="task-content">

                            <h3 class="task-title">
                                Estudar JavaScript
                            </h3>

                            <p class="task-category">
                                Estudos
                            </p>

                        </div>


                        <div class="task-right">

                            <span class="task-time">
                                19:00
                            </span>


                            <button
                                class="task-status completed"
                                aria-label="Marcar tarefa como concluída"
                            >

                                <i data-lucide="check"></i>

                            </button>

                        </div>

                    </div>



                    <!-- TAREFA 2 -->

                    <div class="task-card">

                        <div class="task-content">

                            <h3 class="task-title">
                                Treino de Academia
                            </h3>

                            <p class="task-category">
                                Saúde
                            </p>

                        </div>


                        <div class="task-right">

                            <span class="task-time">
                                20:30
                            </span>


                            <button
                                class="task-status"
                                aria-label="Marcar tarefa como concluída"
                            >

                            </button>

                        </div>

                    </div>



                    <!-- TAREFA 3 -->

                    <div class="task-card">

                        <div class="task-content">

                            <h3 class="task-title">
                                Ler 20 páginas
                            </h3>

                            <p class="task-category">
                                Leitura
                            </p>

                        </div>


                        <div class="task-right">

                            <span class="task-time">
                                21:00
                            </span>


                            <button
                                class="task-status"
                                aria-label="Marcar tarefa como concluída"
                            >

                            </button>

                        </div>

                    </div>


                </div>


            </section>


        </main>


    </div>



    <!-- LUCIDE -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <script>

        lucide.createIcons();

    </script>


</body>

</html>
