<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Criar Conta | Donee</title>


    <!-- ================================================= -->
    <!-- FONTES -->
    <!-- ================================================= -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
        rel="stylesheet"
    >


    <!-- ================================================= -->
    <!-- CSS -->
    <!-- ================================================= -->

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >

    <link
        rel="stylesheet"
        href="../css/login.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >

</head>


<body>


    <!-- ================================================= -->
    <!-- PÁGINA DE CADASTRO -->
    <!-- ================================================= -->

    <main class="login">


        <section class="login-container">


            <!-- ================================================= -->
            <!-- LOGO -->
            <!-- ================================================= -->

            <a
                href="../index.html"
                class="logo"
            >

                <img
                    src="../assets/images/logo-Donee.png"
                    alt="Logo Donee"
                >

            </a>


            <!-- ================================================= -->
            <!-- CABEÇALHO -->
            <!-- ================================================= -->

            <div class="login-header">

                <h1>
                    Crie sua conta
                </h1>

                <p>
                    Comece agora a organizar sua rotina com o Donee.
                </p>

            </div>


            <!-- ================================================= -->
            <!-- MENSAGEM -->
            <!-- ================================================= -->

            <div
                id="mensagem"
                class="auth-message"
                style="display: none;"
            ></div>


            <!-- ================================================= -->
            <!-- FORMULÁRIO -->
            <!-- ================================================= -->

            <form
                class="login-form"
                id="cadastroForm"
            >


                <!-- ================================================= -->
                <!-- NOME -->
                <!-- ================================================= -->

                <div class="input-group">

                    <label
                        class="input-label"
                        for="nome"
                    >
                        Nome
                    </label>

                    <input
                        class="input"
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- ================================================= -->
                <!-- E-MAIL -->
                <!-- ================================================= -->

                <div class="input-group">

                    <label
                        class="input-label"
                        for="email"
                    >
                        E-mail
                    </label>

                    <input
                        class="input"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- ================================================= -->
                <!-- SENHA -->
                <!-- ================================================= -->

                <div class="input-group">

                    <label
                        class="input-label"
                        for="senha"
                    >
                        Senha
                    </label>

                    <input
                        class="input"
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- ================================================= -->
                <!-- CONFIRMAR SENHA -->
                <!-- ================================================= -->

                <div class="input-group">

                    <label
                        class="input-label"
                        for="confirmarSenha"
                    >
                        Confirmar senha
                    </label>

                    <input
                        class="input"
                        type="password"
                        id="confirmarSenha"
                        name="confirmarSenha"
                        placeholder="Digite sua senha novamente"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- ================================================= -->
                <!-- BOTÃO CADASTRAR -->
                <!-- ================================================= -->

                <button
                    class="btn-primary"
                    type="submit"
                >

                    Criar conta

                </button>


            </form>


            <!-- ================================================= -->
            <!-- RODAPÉ -->
            <!-- ================================================= -->

            <div class="login-footer">

                <p>

                    Já possui uma conta?

                    <a href="login.html">
                        Entrar
                    </a>

                </p>

            </div>


        </section>


    </main>


    <!-- ================================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================================= -->

    <script src="../js/auth.js"></script>

    <script src="../js/cadastro.js"></script>


</body>

</html>
