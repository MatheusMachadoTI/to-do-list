<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Perfil | Donee</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="../css/components.css">

    <link rel="stylesheet" href="../css/profile.css">

    <link rel="stylesheet" href="../css/dashboard.css">

    <link rel="stylesheet" href="../css/responsive.css">

    <script src="https://unpkg.com/lucide@latest"></script>

</head>


<body>


    <!-- ================================================= -->
    <!-- MENU LATERAL -->
    <!-- ================================================= -->

    <aside class="sidebar">


        <!-- LOGO -->

        <div class="sidebar-logo">

            <a href="dashboard.html">

                <img
                    src="../assets/images/logo-Donee.png"
                    alt="Logo Donee"
                >

            </a>

        </div>


        <!-- MENU -->

        <nav class="sidebar-menu">


            <!-- DASHBOARD -->

            <a
                href="dashboard.html"
                class="menu-item"
            >

                <i data-lucide="layout-dashboard"></i>

                <span>
                    Dashboard
                </span>

            </a>


            <!-- TAREFAS -->

            <a
                href="tasks.html"
                class="menu-item"
            >

                <i data-lucide="list-checks"></i>

                <span>
                    Tarefas
                </span>

            </a>


            <!-- PERFIL -->

            <a
                href="profile.html"
                class="menu-item active"
            >

                <i data-lucide="user"></i>

                <span>
                    Perfil
                </span>

            </a>

            <a
                    href="settings.html"
                    class="menu-item"
                >

                    <i data-lucide="settings"></i>

                    <span>Configurações</span>

                </a>

        </nav>


        <!-- ================================================= -->
        <!-- USUÁRIO -->
        <!-- ================================================= -->

        <a
            href="profile.html"
            class="sidebar-profile"
        >

            <div class="profile-avatar">

                <i data-lucide="user"></i>

            </div>


            <div class="profile-info">

                <strong>
                    Matheus
                </strong>

                <span>
                    Meu perfil
                </span>

            </div>


            <i
                data-lucide="chevron-right"
                class="profile-arrow"
            ></i>

        </a>


    </aside>



    <!-- ================================================= -->
    <!-- CONTEÚDO PRINCIPAL -->
    <!-- ================================================= -->

    <main class="profile-content">


        <!-- CABEÇALHO -->

        <header class="page-header">

            <span class="page-label">
                CONTA
            </span>

            <h1>
                Meu perfil
            </h1>

            <p>
                Gerencie suas informações pessoais.
            </p>

        </header>



        <!-- ================================================= -->
        <!-- CARD DO PERFIL -->
        <!-- ================================================= -->

        <section class="profile-card">


            <div class="profile-header">


                <!-- AVATAR -->

                <div class="profile-main-avatar">

                    <i data-lucide="user"></i>

                </div>


                <!-- INFORMAÇÕES -->

                <div class="profile-main-info">

                    <h2>
                        Matheus
                    </h2>

                    <p>
                        matheus@email.com
                    </p>

                    <span>
                        Membro do Donee
                    </span>

                </div>


                <!-- EDITAR -->

                <button
                    type="button"
                    class="edit-profile-btn"
                >

                    <i data-lucide="pen"></i>

                    <span>
                        Editar perfil
                    </span>

                </button>


            </div>


        </section>



        <!-- ================================================= -->
        <!-- INFORMAÇÕES PESSOAIS -->
        <!-- ================================================= -->

        <section class="profile-section">


            <!-- TÍTULO -->

            <div class="section-title">

                <div>

                    <span>
                        INFORMAÇÕES PESSOAIS
                    </span>

                    <h2>
                        Seus dados
                    </h2>

                </div>


                <i data-lucide="user"></i>

            </div>



            <!-- FORMULÁRIO -->

            <form class="profile-form">


                <!-- NOME -->

                <div class="form-group">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        value="Matheus"
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="matheus@email.com"
                    >

                </div>


                <!-- TELEFONE -->

                <div class="form-group">

                    <label for="telefone">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000"
                    >

                </div>


            </form>



            <!-- BOTÕES -->

            <div class="form-actions">


                <button
                    type="button"
                    class="cancel-btn"
                >

                    Cancelar

                </button>


                <button
                    type="button"
                    class="save-btn"
                >

                    <i data-lucide="save"></i>

                    <span>
                        Salvar alterações
                    </span>

                </button>


            </div>


        </section>



        <!-- ================================================= -->
        <!-- SEGURANÇA -->
        <!-- ================================================= -->

        <section class="security-card">


            <div class="section-title">

                <div>

                    <span>
                        SEGURANÇA
                    </span>

                    <h2>
                        Senha e segurança
                    </h2>

                </div>


                <i data-lucide="shield-check"></i>

            </div>



            <div class="security-content">


                <div>

                    <h3>
                        Senha
                    </h3>

                    <p>
                        Altere sua senha para manter sua conta protegida.
                    </p>

                </div>


                <button
                    type="button"
                    class="security-btn"
                >

                    Alterar senha

                    <i data-lucide="arrow-right"></i>

                </button>


            </div>


        </section>


    </main>



    <!-- ================================================= -->
    <!-- LUCIDE -->
    <!-- ================================================= -->

    <script>

        lucide.createIcons();

    </script>

    <script src="../js/profile.js"></script>


</body>

</html>
