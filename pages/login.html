<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entrar | Donee</title>


    <!-- FONTE -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/components.css"
    >

    <link
        rel="stylesheet"
        href="../css/login.css"
    >

    <link
        rel="stylesheet"
        href="../css/responsive.css"
    >

</head>


<body>


    <!-- ================================================= -->
    <!-- LOGIN -->
    <!-- ================================================= -->

    <main class="login">

        <section class="login-container">


            <!-- LOGO -->

            <a
                href="../index.html"
                class="logo"
            >

                <img
                    src="../assets/images/logo-Donee.png"
                    alt="Logo Donee"
                >

            </a>


            <!-- CABEÇALHO -->

            <div class="login-header">

                <h1>
                    Bem-vindo de volta!
                </h1>

                <p>
                    Entre na sua conta para continuar.
                </p>

            </div>


            <!-- MENSAGEM -->

            <div
                id="mensagem"
                class="auth-message"
                style="display: none;"
            ></div>


            <!-- FORMULÁRIO -->

            <form
                class="login-form"
                id="loginForm"
            >


                <!-- EMAIL -->

                <div class="input-group">

                    <label
                        class="input-label"
                        for="email"
                    >
                        Email
                    </label>

                    <input
                        class="input"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- SENHA -->

                <div class="input-group">

                    <label
                        class="input-label"
                        for="senha"
                    >
                        Senha
                    </label>

                    <input
                        class="input"
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- BOTÃO -->

                <button
                    class="btn-primary"
                    type="submit"
                >

                    Entrar

                </button>


            </form>


            <!-- RODAPÉ -->

            <div class="login-footer">

                <p>

                    Não possui uma conta?

                    <a href="cadastro.html">
                        Criar conta
                    </a>

                </p>

            </div>


        </section>

    </main>


    <!-- ================================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================================= -->

    <script src="../js/auth.js"></script>

    <script src="../js/login.js"></script>


</body>

</html>
